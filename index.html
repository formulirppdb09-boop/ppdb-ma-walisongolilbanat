<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Layanan Madrasah - MA Wali Songo Lilbanat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type="text"], textarea { text-transform: uppercase; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- HEADER UTAMA (MANTAP SEJAJAR) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Logo & Identitas Madrasah (Kiri) -->
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('beranda')">
                    <img src="logo-kemenag.png" alt="Logo Kemenag" class="h-12 w-auto" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/b/be/Logo_Kementerian_Agama_Republik_Indonesia.png'">
                    <div class="leading-tight">
                        <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Pusat Layanan GTK & Siswa</span>
                        <h1 class="text-sm md:text-base font-extrabold text-emerald-800 uppercase tracking-tight">MA Wali Songo Lilbanat</h1>
                        <span class="block text-[10px] text-slate-400">Kementerian Agama Republik Indonesia</span>
                    </div>
                </div>

                <!-- Menu Navigasi Atas Ringkas (Sebelum Login) -->
                <nav class="hidden lg:flex items-center space-x-6 text-sm font-medium text-slate-600">
                    <button onclick="switchTab('beranda')" class="nav-link text-emerald-600 font-semibold border-b-2 border-emerald-600 pb-1" id="nav-beranda">Beranda</button>
                    <button onclick="switchTab('statistik')" class="nav-link hover:text-emerald-600 transition pb-1" id="nav-statistik">Statistik</button>
                    <button onclick="switchTab('spmb')" class="nav-link hover:text-emerald-600 transition pb-1" id="nav-spmb">SPMB</button>
                    <button onclick="switchTab('daful')" class="nav-link hover:text-emerald-600 transition pb-1" id="nav-daful">DAFUL</button>
                </nav>

                <!-- Area Login / Sesi User (Pojok Kanan) -->
                <div id="authHeaderContainer" class="relative">
                    <button onclick="toggleLoginDropdown()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2.5 rounded-lg text-sm flex items-center space-x-2 shadow transition-all duration-150">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Login</span>
                    </button>
                    
                    <div id="loginDropdown" class="absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-lg shadow-2xl py-2 hidden z-50">
                        <button onclick="openLoginModal('Admin')" class="w-full text-left px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-emerald-50 hover:text-emerald-800 transition flex items-center space-x-2">
                            <i class="fa-solid fa-user-shield text-emerald-600"></i>
                            <span>Login Admin</span>
                        </button>
                        <button onclick="openLoginModal('PTK')" class="w-full text-left px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-emerald-50 hover:text-emerald-800 transition flex items-center space-x-2">
                            <i class="fa-solid fa-user-tie text-emerald-600"></i>
                            <span>Login PTK</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- WRAPPER UTAMA (BERISI SIDEBAR KIRI + KONTEN) -->
    <div class="flex-1 flex max-w-7xl w-full mx-auto">
        
        <!-- SIDEBAR KIRI (HANYA MUNCUL SETELAH LOGIN) -->
        <aside id="sidebarInternal" class="w-64 bg-slate-900 text-slate-200 min-h-screen p-4 hidden flex-col border-r border-slate-800 shadow-xl transition-all">
            <!-- Profil Singkat Petugas -->
            <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700/60 mb-6 flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold shadow">
                    <i class="fa-solid fa-user-tie text-lg"></i>
                </div>
                <div class="overflow-hidden">
                    <span id="sideUserNama" class="block text-xs font-bold text-white truncate">Admin SIM</span>
                    <span id="sideUserJabatan" class="block text-[10px] text-emerald-400 font-semibold uppercase truncate">PTK / Operator</span>
                </div>
            </div>

            <!-- Menu Internal Samping Kiri -->
            <div class="space-y-1">
                <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">Menu Utama SIM</span>
                <button onclick="switchTab('daftarsiswalengkap')" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-semibold hover:bg-emerald-800/50 hover:text-white transition flex items-center space-x-2.5 text-slate-300">
                    <i class="fa-solid fa-address-book text-emerald-400 w-4"></i>
                    <span>Daftar Siswa</span>
                </button>
                <button onclick="switchTab('mutasi')" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-semibold hover:bg-emerald-800/50 hover:text-white transition flex items-center space-x-2.5 text-slate-300">
                    <i class="fa-solid fa-right-left text-amber-400 w-4"></i>
                    <span>Mutasi Siswa</span>
                </button>
                <button onclick="switchTab('rombel')" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-semibold hover:bg-emerald-800/50 hover:text-white transition flex items-center space-x-2.5 text-slate-300">
                    <i class="fa-solid fa-people-roof text-blue-400 w-4"></i>
                    <span>Rombel Kelas</span>
                </button>
                <button onclick="switchTab('gtk')" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-semibold hover:bg-emerald-800/50 hover:text-white transition flex items-center space-x-2.5 text-slate-300">
                    <i class="fa-solid fa-chalkboard-user text-purple-400 w-4"></i>
                    <span>Guru & Tendik</span>
                </button>
                <button onclick="switchTab('laporan')" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-semibold hover:bg-emerald-800/50 hover:text-white transition flex items-center space-x-2.5 text-slate-300">
                    <i class="fa-solid fa-file-chart-column text-rose-400 w-4"></i>
                    <span>Program & Laporan</span>
                </button>
            </div>

            <!-- Tombol Keluar Samping -->
            <div class="mt-auto pt-6 border-t border-slate-800">
                <button onclick="prosesLogout()" class="w-full bg-red-600/20 hover:bg-red-600/30 text-red-400 font-bold px-3 py-2.5 rounded-lg text-xs border border-red-500/30 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Keluar Sistem</span>
                </button>
            </div>
        </aside>

        <!-- KONTEN HALAMAN UTAMA -->
        <main class="flex-1 w-full overflow-hidden">
            <!-- TAB BERANDA, SPMB, DAFUL, DULL ADA DI SINI -->
        </main>
    </div>

    <!-- LOGIKA JAVASCRIPT PEMBARUAN TAMPILAN SESI -->
    <script>
        let currentUser = JSON.parse(localStorage.getItem('sim_user')) || null;

        window.addEventListener('DOMContentLoaded', () => {
            perbaruiTampilanSesi();
        });

        // --- UPDATE LAYOUT & SIDEBAR SETELAH LOGIN ---
        function perbaruiTampilanSesi() {
            const containerLogin = document.getElementById('authHeaderContainer');
            const sidebar = document.getElementById('sidebarInternal');

            if (currentUser) {
                // Jika SUDAH LOGIN: Tampilkan Sidebar Kiri & Ringkasan Akun di Header
                if (sidebar) {
                    sidebar.classList.remove('hidden');
                    sidebar.classList.add('flex');
                    document.getElementById('sideUserNama').innerText = currentUser.nama;
                    document.getElementById('sideUserJabatan').innerText = currentUser.jabatan || currentUser.role;
                }

                if (containerLogin) {
                    containerLogin.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="text-right hidden sm:block">
                                <span class="block text-xs font-bold text-slate-800">${currentUser.nama}</span>
                                <span class="block text-[10px] text-emerald-700 font-semibold uppercase">${currentUser.jabatan || currentUser.role}</span>
                            </div>
                            <button onclick="prosesLogout()" class="bg-red-50 hover:bg-red-100 text-red-700 font-bold px-3 py-2 rounded-lg text-xs border border-red-200 shadow-sm transition flex items-center space-x-1" title="Keluar">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span>Keluar</span>
                            </button>
                        </div>
                    `;
                }
            } else {
                // Jika BELUM LOGIN: Sembunyikan Sidebar Kiri
                if (sidebar) {
                    sidebar.classList.add('hidden');
                    sidebar.classList.remove('flex');
                }
            }
        }
    </script>
</body>
</html>
