<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrasi - MA Wali Songo Lilbanat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .kotak-cari {
            width: 100% !important;
            max-width: 320px !important;
            padding: 8px 12px 8px 36px !important;
            border: 2px solid #cbd5e1 !important;
            background-color: #f8fafc !important;
            border-radius: 8px !important;
            font-size: 14px !important;
            outline: none !important;
            transition: all 0.2s ease-in-out !important;
        }
        .kotak-cari:focus {
            border-color: #059669 !important;
            background-color: #ffffff !important;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2) !important;
        }
    </style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden">

    <aside class="w-64 bg-emerald-900 text-white flex-shrink-0 flex flex-col shadow-xl">
        <div class="p-6 border-b border-emerald-800 text-center">
            <h2 class="text-xl font-bold tracking-widest text-amber-400">MA WALISONGO</h2>
            <p class="text-xs text-emerald-300 uppercase mt-1">Sistem Administrasi</p>
        </div>

        <nav class="flex-1 overflow-y-auto py-4">
            <button onclick="window.location.reload();" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 hover:text-white transition-colors border-l-4 border-amber-500 text-left cursor-pointer font-medium">
                <i class="fa-solid fa-gauge w-6"></i>
                <span class="ml-3">Dashboard</span>
            </button>

            <div id="menuSiswaGroup" class="group">
                <button onclick="toggleMenu('menuSiswa')" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 transition-colors cursor-pointer text-left font-medium">
                    <i class="fa-solid fa-users w-6"></i>
                    <span class="ml-3 flex-1">Menu Siswa</span>
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="menuSiswa" class="hidden bg-emerald-950/50 py-2 text-sm pl-8">
                    <button onclick="bukaDataSiswaPPDB();" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Data Siswa (PPDB/Daful)</button>
                    <button onclick="bukaMenuRombel();" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Rombel Siswa</button>
                    <button class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-not-allowed text-slate-500 bg-transparent border-0 font-medium" disabled>- Mutasi Masuk</button>
                    <button class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-not-allowed text-slate-500 bg-transparent border-0 font-medium" disabled>- Mutasi Keluar</button>
                    <button onclick="bukaMasterDataSiswa();" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Data Buku Induk</button>
                </div>
            </div>

            <div id="menuGuruGroup" class="group">
                <button onclick="toggleMenu('menuGuru')" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 transition-colors cursor-pointer text-left font-medium">
                    <i class="fa-solid fa-chalkboard-user w-6"></i>
                    <span class="ml-3 flex-1">Guru & Tendik</span>
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="menuGuru" class="hidden bg-emerald-950/50 py-2 text-sm pl-8">
                    <button class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-not-allowed text-slate-500 bg-transparent border-0 font-medium" disabled>- Daftar Guru</button>
                    <button class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-not-allowed text-slate-500 bg-transparent border-0 font-medium" disabled>- Daftar Tendik</button>
                </div>
            </div>

            <div id="menuProgramGroup" class="group">
                <button onclick="toggleMenu('menuProgram')" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 transition-colors cursor-pointer text-left font-medium">
                    <i class="fa-solid fa-clipboard-list w-6"></i>
                    <span class="ml-3 flex-1">Program</span>
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="menuProgram" class="hidden bg-emerald-950/50 py-2 text-sm pl-8">
                    <button onclick="bukaFormLaporan('Tendik')" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Program Tendik</button>
                    <button onclick="bukaFormLaporan('Kesiswaan')" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Program Kesiswaan</button>
                </div>
            </div>

            <button onclick="logout()" class="w-full flex items-center px-6 py-3 mt-8 text-rose-300 hover:bg-rose-950 transition-colors text-left font-bold cursor-pointer">
                <i class="fa-solid fa-right-from-bracket w-6"></i>
                <span class="ml-3">Keluar Sistem</span>
            </button>
        </nav>

        <div class="p-4 bg-emerald-950 text-center text-[10px] text-emerald-500 uppercase tracking-tighter">
            &copy; 2026 MA Wali Songo Lilbanat
        </div>
    </aside>

    <main class="flex-1 flex flex-col">
        <header class="bg-white h-16 shadow-sm flex items-center justify-between px-8">
            <h3 class="text-slate-600 font-semibold" id="currentMenuTitle">Halaman Utama</h3>
            <div class="flex items-center space-x-4">
                <span id="userNama" class="text-sm text-slate-500 font-medium">Halo, Pengguna</span>
                <div id="userInisial" class="h-8 w-8 bg-amber-500 rounded-full flex items-center justify-center text-white font-bold">?</div>
            </div>
        </header>

        <div class="p-8 overflow-y-auto" id="contentArea">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-xs font-bold text-slate-500 uppercase">Total Siswa Aktif</p>
                    <h4 class="text-2xl font-black text-slate-800">120</h4>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-emerald-500">
                    <p class="text-xs font-bold text-slate-500 uppercase">Siswa Baru (PPDB)</p>
                    <h4 class="text-2xl font-black text-slate-800">45</h4>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-amber-500">
                    <p class="text-xs font-bold text-slate-500 uppercase">Guru & Tendik</p>
                    <h4 class="text-2xl font-black text-slate-800">18</h4>
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow-sm h-64 flex items-center justify-center border-2 border-dashed border-slate-200">
                <p class="text-slate-400 italic">Pilih menu di samping untuk mengelola administrasi...</p>
            </div>
        </div>
    </main>

    <div id="modalDetailSiswa" onclick="tutupModalDetail(event)" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200" onclick="event.stopPropagation()">
            <div class="bg-emerald-800 text-white p-4 flex justify-between items-center flex-shrink-0">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-address-card text-amber-400 text-lg"></i>
                    <h3 class="font-bold text-base tracking-wide" id="modalHeaderNama">Detail Lengkap Calon Siswa</h3>
                </div>
                <button onclick="document.getElementById('modalDetailSiswa').classList.add('hidden')" class="text-white/80 hover:text-white hover:bg-emerald-900 h-8 w-8 rounded-full transition flex items-center justify-center cursor-pointer font-black">✕</button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6 text-sm text-slate-700" id="modalKontenDetail">
                </div>
            <div class="bg-slate-50 p-3 border-t border-slate-100 flex justify-end flex-shrink-0">
                <button onclick="document.getElementById('modalDetailSiswa').classList.add('hidden')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-lg text-xs transition cursor-pointer">Tutup Detail</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwNf6X1QPHHfFRc1mZoG1Tmzss39N026ldLGJDMLYg-Fxfi2moq2-xIuK7GpWmvp9tv/exec";

        // --- 1. PROTEKSI LOGIN ---
        const userData = JSON.parse(localStorage.getItem('user_sim'));
        
        if (!userData) {
            window.location.href = "login.html"; 
        } else {
            document.getElementById('currentMenuTitle').innerText = "Dashboard - " + userData.jabatan;
            document.getElementById('userNama').innerText = "Halo, " + userData.nama;
            document.getElementById('userInisial').innerText = userData.nama.charAt(0).toUpperCase();

            if (userData.role === "TENDIK") {
                document.getElementById('menuSiswaGroup').style.display = 'none';
                document.getElementById('menuGuruGroup').style.display = 'none';
            }
        }

        function toggleMenu(id) {
            const menu = document.getElementById(id);
            menu.classList.toggle('hidden');
        }

        function logout() {
            localStorage.removeItem('user_sim');
            window.location.href = "login.html";
        }

        // --- 2. FORM PELAPORAN BULANAN TENDIK ---
        function bukaFormLaporan(jenisProgram) {
            document.getElementById('currentMenuTitle').innerText = "Program " + jenisProgram + " - Laporan Bulanan";
            
            const htmlForm = `
                <div class="bg-white p-6 rounded-xl shadow-sm max-w-2xl border-t-4 border-emerald-600">
                    <h4 class="text-lg font-bold text-slate-700 mb-4">Form Pelaporan Bulanan (${jenisProgram.toUpperCase()})</h4>
                    <form id="formLaporanBulanan" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Bulan Pelaporan</label>
                            <select id="bulanLaporan" required class="w-full px-4 py-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                                <option value="">-- Pilih Bulan --</option>
                                <option value="Januari">Januari</option>
                                <option value="Februari">Februari</option>
                                <option value="Maret">Maret</option>
                                <option value="April">April</option>
                                <option value="Mei">Mei</option>
                                <option value="Juni">Juni</option>
                                <option value="Juli">Juli</option>
                                <option value="Agustus">Agustus</option>
                                <option value="September">September</option>
                                <option value="Oktober">Oktober</option>
                                <option value="November">November</option>
                                <option value="Desember">Desember</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Rincian Laporan Kegiatan</label>
                            <textarea id="isiLaporan" rows="6" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Ketikkan laporan bulanan secara detail di sini..."></textarea>
                        </div>
                        <button type="submit" id="btnKirimLaporan" class="bg-emerald-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-emerald-700 transition shadow cursor-pointer">
                            Kirim Laporan
                        </button>
                    </form>
                </div>
            `;
            
            document.getElementById('contentArea').innerHTML = htmlForm;

            document.getElementById('formLaporanBulanan').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btnKirimLaporan');
                if (btn.disabled) return;

                btn.innerText = "Mengirim...";
                btn.disabled = true;

                const bulan = document.getElementById('bulanLaporan').value;
                const isi = document.getElementById('isiLaporan').value;

                const params = new URLSearchParams({
                    action: "simpanLaporan",
                    username: userData.username || "user_sim", 
                    nama: userData.nama,
                    jabatan: userData.jabatan,
                    bulan: bulan + " (" + jenisProgram + ")",
                    isi_laporan: isi
                });

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: params,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    });
                    const result = await response.json();

                    if (result.status === "success") {
                        alert("Alhamdulillah, Laporan Bulan " + bulan + " Berhasil Tersimpan!");
                        bukaFormLaporan(jenisProgram);
                    } else {
                        alert("Gagal: " + result.message);
                    }
                } catch (err) {
                    console.error(err);
                    alert("Terjadi kesalahan jaringan.");
                } finally {
                    btn.innerText = "Kirim Laporan";
                    btn.disabled = false;
                }
            });
        }

        // --- 3. MASTER DATA SISWA (BUKU INDUK) + LIVE SEARCH + POPUP ICON ---
        async function bukaMasterDataSiswa() {
            document.getElementById('currentMenuTitle').innerText = "Menu Siswa - Data Buku Induk Madrasah";
            
            document.getElementById('contentArea').innerHTML = `
                <div class="flex flex-col items-center justify-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-700 mb-3"></div>
                    <p class="text-slate-500 italic text-sm">Sedang memuat database Buku Induk siswa aktif...</p>
                </div>
            `;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ action: "ambilDataSiswaAktif" }),
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();

                if (result.status === "success") {
                    window.allSiswaData = result.data;
                    window.currentFilterKelas = 'SEMUA';
                    
                    const htmlMaster = `
                        <div class="space-y-6">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 justify-between items-center" style="display: flex !important;">
                                <div class="flex flex-wrap gap-2 w-full md:w-auto">
                                    <button onclick="setFilterKelas('SEMUA')" id="btnFilter-SEMUA" class="px-4 py-2 text-xs font-bold rounded-lg bg-emerald-700 text-white shadow transition cursor-pointer">All (${result.data.length})</button>
                                    <button onclick="setFilterKelas('10')" id="btnFilter-10" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition cursor-pointer">Kelas 10</button>
                                    <button onclick="setFilterKelas('11')" id="btnFilter-11" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition cursor-pointer">Kelas 11</button>
                                    <button onclick="setFilterKelas('12')" id="btnFilter-12" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition cursor-pointer">Kelas 12</button>
                                </div>
                                <div style="position: relative !important; width: 100% !important; max-width: 320px !important;">
                                    <span style="position: absolute !important; left: 12px !important; top: 10px !important; color: #94a3b8 !important;">
                                        <i class="fa-solid fa-magnifying-glass"></i>
                                    </span>
                                    <input type="text" id="searchBukuInduk" oninput="jalankanLiveSearchBukuInduk()" placeholder="Ketik nama / nisn..." class="kotak-cari">
                                </div>
                            </div>

                            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse whitespace-nowrap">
                                        <thead>
                                            <tr class="bg-slate-100 text-slate-700 text-xs font-bold uppercase tracking-wider border-b border-slate-200">
                                                <th class="px-4 py-3 text-center w-12">No</th>
                                                <th class="px-4 py-3">Nama Lengkap</th>
                                                <th class="px-4 py-3">NISN</th>
                                                <th class="px-4 py-3">NISM</th>
                                                <th class="px-4 py-3">TTL</th>
                                                <th class="px-4 py-3">Nama Ayah</th>
                                                <th class="px-4 py-3">Nama Ibu</th>
                                                <th class="px-4 py-3 text-center w-20">Kelas</th>
                                                <th class="px-4 py-3 text-center w-24">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody id="bodyTabelSiswa"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    document.getElementById('contentArea').innerHTML = htmlMaster;
                    renderTabelBukuInduk(result.data);
                } else {
                    alert("Gagal memuat database: " + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("Gagal menghubungkan ke server Master Data.");
            }
        }

        function setFilterKelas(target) {
            window.currentFilterKelas = target;
            ['SEMUA', '10', '11', '12'].forEach(k => {
                const btn = document.getElementById('btnFilter-' + k);
                if (btn) btn.className = "px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition cursor-pointer";
            });
            const btnAktif = document.getElementById('btnFilter-' + target);
            if (btnAktif) btnAktif.className = "px-4 py-2 text-xs font-bold rounded-lg bg-emerald-700 text-white shadow transition cursor-pointer";
            jalankanLiveSearchBukuInduk();
        }

        function jalankanLiveSearchBukuInduk() {
            const keyword = document.getElementById('searchBukuInduk').value.toLowerCase().trim();
            let dataHasil = window.allSiswaData;

            if (window.currentFilterKelas !== 'SEMUA') {
                dataHasil = dataHasil.filter(s => String(s.kelas).trim().startsWith(window.currentFilterKelas));
            }

            if (keyword !== '') {
                dataHasil = dataHasil.filter(s => 
                    String(s.nama).toLowerCase().includes(keyword) || 
                    String(s.nisn).toLowerCase().includes(keyword)
                );
            }
            renderTabelBukuInduk(dataHasil);
        }

function renderTabelBukuInduk(arrayData) {
            const tbody = document.getElementById('bodyTabelSiswa');
            if (!tbody) return;

            let rowsHtml = "";
            arrayData.forEach((siswa, index) => {
                rowsHtml += `
                    <tr class="border-b border-slate-200 hover:bg-slate-50 transition-colors text-sm">
                        <td class="px-4 py-3 text-center text-slate-500">${index + 1}</td>
                        <td class="px-4 py-3 font-semibold text-slate-800 flex items-center gap-2">
                            <button onclick="bukaPopUpDetailSiswa('${siswa.id}')" class="text-emerald-700 hover:text-amber-500 transition cursor-pointer" title="Klik untuk lihat biodata lengkap">
                                <i class="fa-solid fa-circle-user text-base"></i>
                            </button>
                            <span>${siswa.nama}</span>
                        </td>
                        <td class="px-4 py-3 text-slate-600 font-mono text-xs">${siswa.nisn}</td>
                        <td class="px-4 py-3 text-slate-600 font-mono text-xs">${siswa.nism}</td>
                        <td class="px-4 py-3 text-slate-600 text-xs">${siswa.tempat_lahir}, ${siswa.tanggal_lahir}</td>
                        <td class="px-4 py-3 text-slate-700">${siswa.nama_ayah}</td>
                        <td class="px-4 py-3 text-slate-700">${siswa.nama_ibu}</td>
                        <td class="px-4 py-3 text-center"><span class="bg-blue-50 text-blue-700 border border-blue-200 text-xs font-bold px-2.5 py-0.5 rounded-md">${siswa.kelas}</span></td>
                        <td class="px-4 py-3 text-center"><span class="bg-emerald-100 text-emerald-800 text-xs font-extrabold px-2 py-0.5 rounded-full">${siswa.status}</span></td>
                    </tr>
                `;
            });
            tbody.innerHTML = rowsHtml || `<tr><td colspan="9" class="text-center py-12 text-slate-400 italic">Data siswa tidak ditemukan...</td></tr>`;
        }
        
// --- FUNGSI POP-UP DETAIL + TOMBOL CETAK PROFIL SISWA ---
        function bukaPopUpDetailSiswa(idSiswa) {
            const modal = document.getElementById('modalDetailSiswa');
            const konten = document.getElementById('modalKontenDetail');
            
            const siswa = window.allSiswaData.find(s => String(s.id) === String(idSiswa));
            
            if (!siswa) {
                alert("Data siswa tidak ditemukan di sistem.");
                return;
            }

            document.getElementById('modalHeaderNama').innerText = "BIODATA BUKU INDUK SISWA: " + siswa.nama;
            
            konten.innerHTML = `
                <div class="border-b border-slate-200 pb-3 mb-4 flex justify-between items-center">
                    <h5 class="text-xs font-bold text-emerald-800 uppercase tracking-wider"><i class="fa-solid fa-user-graduate mr-1"></i> Identitas Pribadi Siswa</h5>
                    <button onclick="cetakProfilSiswaAktif('${siswa.id}')" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-sm flex items-center gap-1 cursor-pointer">
                        <i class="fa-solid fa-print"></i> Cetak Profil Siswa
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">ID Sistem / Rombel</p>
                        <p class="font-bold text-slate-800 text-sm mt-0.5">${siswa.id} / <span class="text-blue-600">${siswa.kelas}</span></p>
                    </div>
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Nomor NISN</p>
                        <p class="font-mono font-bold text-slate-700 text-sm mt-0.5">${siswa.nisn}</p>
                    </div>
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Nomor NISM</p>
                        <p class="font-mono font-bold text-slate-700 text-sm mt-0.5">${siswa.nism}</p>
                    </div>
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Nomor NIK Siswa</p>
                        <p class="font-mono text-slate-700 text-xs mt-0.5">${siswa.nik || "-"}</p>
                    </div>
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Tempat, Tanggal Lahir</p>
                        <p class="font-medium text-slate-700 text-xs mt-0.5">${siswa.tempat_lahir}, ${siswa.tanggal_lahir}</p>
                    </div>
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Jenis Kelamin</p>

        function jalankanLiveSearchPPDB() {
            const keyword = document.getElementById('searchPPDB').value.toLowerCase().trim();
            let dataHasil = window.allPPDBData;

            if (keyword !== '') {
                dataHasil = dataHasil.filter(s => String(s.nama).toLowerCase().includes(keyword));
            }
            renderTabelPPDB(dataHasil);
        }

        function renderTabelPPDB(arrayData) {
            const tbody = document.getElementById('bodyTabelPPDB');
            if (!tbody) return;

            let rowsHtml = "";
            arrayData.forEach((siswa, index) => {
                let badgeClass = "bg-amber-100 text-amber-800 border-amber-200";
                let tombolDaful = `
                    <button id="btnDaful-${siswa.rowNumber}" onclick="eksekusiDaftarUlang(${siswa.rowNumber}, '${siswa.nama.replace(/'/g, "\\'")}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition cursor-pointer flex items-center gap-1">
                        <i class="fa-solid fa-user-check"></i> Daful
                    </button>
                `;

                if (siswa.status_daful === "SUDAH DAFTAR ULANG") {
                    badgeClass = "bg-emerald-100 text-emerald-800 border-emerald-200 font-extrabold";
                    tombolDaful = `
                        <button class="bg-slate-100 text-slate-400 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 cursor-not-allowed" disabled>
                            <i class="fa-solid fa-check"></i> Selesai
                        </button>
                    `;
                }

                rowsHtml += `
                    <tr class="border-b border-slate-200 hover:bg-slate-50 transition-colors text-sm">
                        <td class="px-4 py-3 text-center text-slate-500">${index + 1}</td>
                        <td class="px-4 py-3 font-semibold text-slate-800">${siswa.nama}</td>
                        <td class="px-4 py-3 text-slate-600 font-mono text-xs">${siswa.nisn || "-"}</td>
                        <td class="px-4 py-3 text-center text-slate-600">${siswa.jk}</td>
                        <td class="px-4 py-3 text-slate-600 text-xs">${siswa.asal_sekolah || "-"}</td>
                        <td class="px-4 py-3 text-center">
                            <span class="border px-2.5 py-0.5 rounded-full text-xs font-medium ${badgeClass}">
                                ${siswa.status_daful}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-center flex justify-center gap-1">
                            ${tombolDaful}
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = rowsHtml || `<tr><td colspan="7" class="text-center py-12 text-slate-400 italic">Data pendaftar tidak ditemukan...</td></tr>`;
        }

        async function eksekusiDaftarUlang(rowNumber, namaSiswa) {
            if (!confirm(`Apakah Anda yakin ingin memproses Daftar Ulang untuk "${namaSiswa}"?`)) return;

            const btnTarget = document.getElementById(`btnDaful-${rowNumber}`);
            if (btnTarget) {
                if (btnTarget.disabled) return;
                btnTarget.innerText = "Locking...";
                btnTarget.disabled = true;
                btnTarget.className = "bg-slate-400 text-white text-xs font-bold px-3 py-1.5 rounded-lg cursor-not-allowed flex items-center gap-1";
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ action: "prosesDaful", rowNumber: rowNumber }),
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();

                if (result.status === "success") {
                    alert(`Berhasil! ${namaSiswa} telah resmi masuk ke database induk Buku Induk.`);
                    bukaDataSiswaPPDB();
                } else {
                    alert("Gagal: " + result.message);
                    bukaDataSiswaPPDB();
                }
            } catch (err) {
                console.error(err);
                alert("Kesalahan koneksi internet.");
                bukaDataSiswaPPDB();
            }
        }

                                    <td class="px-4 py-2 text-center">
                                        <button id="btnKeluar-${siswa.rowNumber}" onclick="pindahkanSiswaKeRombel(${siswa.rowNumber}, '${tingkat}', '${namaRombel}', '${siswa.nama.replace(/'/g, "\\'")}', true)" class="text-rose-600 hover:text-white border border-rose-300 hover:bg-rose-600 text-[10px] font-bold px-2 py-1 rounded transition cursor-pointer">

                        }
                    });

                    document.getElementById('countAnggota').innerText = `${counter} Anak`;
                    document.getElementById('bodyAnggotaRombel').innerHTML = htmlAnggota || `<tr><td colspan="4" class="text-center py-8 text-slate-400 italic">Rombel ini masih kosong...</td></tr>`;

                    const resKosong = await fetch(API_URL, { method: 'POST', body: new URLSearchParams({ action: "ambilSiswaTanpaRombel", tingkat: tingkat }), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    const resultKosong = await resKosong.json();

                    if (resultKosong.status === "success") {
                        window.allSiswaTanpaRombel = resultKosong.data;
                        jalankanSearchAntreanRombel(namaRombel, tingkat);
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        function jalankanSearchAntreanRombel(namaRombel, tingkat) {
            const box = document.getElementById('boxSiswaKosong');
            const keyword = document.getElementById('searchAntreanRombel').value.toLowerCase().trim();
            if (!box || !window.allSiswaTanpaRombel) return;

            let dataTersaring = window.allSiswaTanpaRombel;
            if (keyword !== '') {
                dataTersaring = dataTersaring.filter(s => String(s.nama).toLowerCase().includes(keyword));
            }

            let htmlKosong = "";
            dataTersaring.forEach(siswa => {
                htmlKosong += `
                    <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 flex items-center justify-between gap-2 hover:border-blue-300 transition">
                        <div class="min-w-0 flex-1">
                            <p class="text-xs font-bold text-slate-800 truncate">${siswa.nama}</p>
                            <p class="text-[10px] text-slate-500 font-mono">NISN: ${siswa.nisn}</p>
                        </div>
                        <button id="btnMasuk-${siswa.rowNumber}" onclick="pindahkanSiswaKeRombel(${siswa.rowNumber}, '${namaRombel}', '${namaRombel}', '${siswa.nama.replace(/'/g, "\\'")}', false)" class="bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-bold px-2 py-1.5 rounded transition shadow flex-shrink-0 cursor-pointer">
                            <i class="fa-solid fa-plus"></i> Masukkan
                        </button>
                    </div>
                `;
            });
            box.innerHTML = htmlKosong || `<p class="text-xs text-slate-400 italic p-6 text-center">Siswa tidak ditemukan / sudah terbagi habis.</p>`;
        }

        async function pindahkanSiswaKeRombel(rowNumber, kelasTujuan, namaRombel, namaSiswa, isKeluarkan) {
            const btnId = isKeluarkan ? `btnKeluar-${rowNumber}` : `btnMasuk-${rowNumber}`;
            const btn = document.getElementById(btnId);
            
            if (btn) {
                if (btn.disabled) return;
                btn.innerText = "Locking...";
                btn.disabled = true;
                btn.className = "bg-slate-300 text-slate-500 text-[10px] font-bold px-2 py-1 rounded cursor-not-allowed";
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ action: "updateRombel", rowNumber: rowNumber, kelasBaru: kelasTujuan }),
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();

                if (result.status === "success") {
                    loadDetailSiswaRombel(namaRombel, kelasTujuan === namaRombel ? namaRombel : kelasTujuan);
                } else {
                    alert("Gagal memindahkan siswa: " + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("Gagal berkomunikasi dengan database Sheets.");
            }
        }
