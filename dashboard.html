<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrasi - MA Wali Songo Lilbanat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .kotak-cari {
            width: 100% !important;
            max-width: 320px !important;
            padding: 8px 12px 8px 36px !important;
            border: 2px solid #cbd5e1 !important;
            background-color: #f8fafc !important;
            border-radius: 8px !important;
            font-size: 14px !important;
            outline: none !important;
            transition: all 0.2s ease-in-out !important;
        }
        .kotak-cari:focus {
            border-color: #059669 !important;
            background-color: #ffffff !important;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2) !important;
        }
    </style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden">

    <aside class="w-64 bg-emerald-900 text-white flex-shrink-0 flex flex-col shadow-xl">
        <div class="p-6 border-b border-emerald-800 text-center">
            <h2 class="text-xl font-bold tracking-widest text-amber-400">MA WALISONGO</h2>
            <p class="text-xs text-emerald-300 uppercase mt-1">Sistem Administrasi</p>
        </div>

        <nav class="flex-1 overflow-y-auto py-4">
            <button onclick="window.location.reload();" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 hover:text-white transition-colors border-l-4 border-amber-500 text-left cursor-pointer font-medium">
                <i class="fa-solid fa-gauge w-6"></i>
                <span class="ml-3">Dashboard</span>
            </button>

            <div id="menuSiswaGroup" class="group">
                <button onclick="toggleMenu('menuSiswa')" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 transition-colors cursor-pointer text-left font-medium">
                    <i class="fa-solid fa-users w-6"></i>
                    <span class="ml-3 flex-1">Menu Siswa</span>
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="menuSiswa" class="hidden bg-emerald-950/50 py-2 text-sm pl-8">
                    <button onclick="bukaDataSiswaPPDB();" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Data Siswa (PPDB/Daful)</button>
                    <button onclick="bukaMenuRombel();" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Rombel Siswa</button>
                    <button class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-not-allowed text-slate-500 bg-transparent border-0 font-medium" disabled>- Mutasi Masuk</button>
                    <button onclick="bukaMenuMutasiKeluar();" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Mutasi Keluar</button>
                    <button onclick="bukaMasterDataSiswa();" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Data Buku Induk</button>
                </div>
            </div>

            <div id="menuGuruGroup" class="group">
                <button onclick="toggleMenu('menuGuru')" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 transition-colors cursor-pointer text-left font-medium">
                    <i class="fa-solid fa-chalkboard-user w-6"></i>
                    <span class="ml-3 flex-1">Guru & Tendik</span>
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="menuGuru" class="hidden bg-emerald-950/50 py-2 text-sm pl-8">
                    <button class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-not-allowed text-slate-500 bg-transparent border-0 font-medium" disabled>- Daftar Guru</button>
                    <button class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-not-allowed text-slate-500 bg-transparent border-0 font-medium" disabled>- Daftar Tendik</button>
                </div>
            </div>

            <div id="menuProgramGroup" class="group">
                <button onclick="toggleMenu('menuProgram')" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 transition-colors cursor-pointer text-left font-medium">
                    <i class="fa-solid fa-clipboard-list w-6"></i>
                    <span class="ml-3 flex-1">Program</span>
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="menuProgram" class="hidden bg-emerald-950/50 py-2 text-sm pl-8">
                    <button onclick="bukaFormLaporan('Tendik')" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Program Tendik</button>
                    <button onclick="bukaFormLaporan('Kesiswaan')" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Program Kesiswaan</button>
                </div>
            </div>

            <button onclick="logout()" class="w-full flex items-center px-6 py-3 mt-8 text-rose-300 hover:bg-rose-950 transition-colors text-left font-bold cursor-pointer">
                <i class="fa-solid fa-right-from-bracket w-6"></i>
                <span class="ml-3">Keluar Sistem</span>
            </button>
        </nav>

        <div class="p-4 bg-emerald-950 text-center text-[10px] text-emerald-500 uppercase tracking-tighter">
            &copy; 2026 MA Wali Songo Lilbanat
        </div>
    </aside>

    <main class="flex-1 flex flex-col">
        <header class="bg-white h-16 shadow-sm flex items-center justify-between px-8">
            <h3 class="text-slate-600 font-semibold" id="currentMenuTitle">Halaman Utama</h3>
            <div class="flex items-center space-x-4">
                <span id="userNama" class="text-sm text-slate-500 font-medium">Halo, Pengguna</span>
                <div id="userInisial" class="h-8 w-8 bg-amber-500 rounded-full flex items-center justify-center text-white font-bold">?</div>
            </div>
        </header>

        <div class="p-8 overflow-y-auto" id="contentArea">
            </div>
    </main>

    <div id="modalDetailSiswa" onclick="tutupModalDetail(event)" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200" onclick="event.stopPropagation()">
            <div class="bg-emerald-800 text-white p-4 flex justify-between items-center flex-shrink-0">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-address-card text-amber-400 text-lg"></i>
                    <h3 class="font-bold text-base tracking-wide" id="modalHeaderNama">Detail</h3>
                </div>
                <button onclick="document.getElementById('modalDetailSiswa').classList.add('hidden')" class="text-white/80 hover:text-white hover:bg-emerald-900 h-8 w-8 rounded-full transition flex items-center justify-center cursor-pointer font-black">✕</button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6 text-sm text-slate-700" id="modalKontenDetail"></div>
            <div class="bg-slate-50 p-3 border-t border-slate-100 flex justify-end flex-shrink-0">
                <button onclick="document.getElementById('modalDetailSiswa').classList.add('hidden')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-lg text-xs transition cursor-pointer">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwNf6X1QPHHfFRc1mZoG1Tmzss39N026ldLGJDMLYg-Fxfi2moq2-xIuK7GpWmvp9tv/exec";

        // --- 1. INITIALIZATION PROLOGUE ---
        const userData = JSON.parse(localStorage.getItem('user_sim'));
        if (!userData) { window.location.href = "login.html"; } 
        else {
            document.getElementById('currentMenuTitle').innerText = "Dashboard - " + userData.jabatan;
            document.getElementById('userNama').innerText = "Halo, " + userData.nama;
            document.getElementById('userInisial').innerText = userData.nama.charAt(0).toUpperCase();
            if (userData.role === "TENDIK") {
                document.getElementById('menuSiswaGroup').style.display = 'none';
                document.getElementById('menuGuruGroup').style.display = 'none';
            }
        }

        function toggleMenu(id) { document.getElementById(id).classList.toggle('hidden'); }
        function logout() { localStorage.removeItem('user_sim'); window.location.href = "login.html"; }

        // --- 2. FORM PELAPORAN BULANAN TENDIK ---
        function bukaFormLaporan(jenisProgram) {
            document.getElementById('currentMenuTitle').innerText = "Program " + jenisProgram + " - Laporan Bulanan";
            // Konten form laporan bulanan...
        }

        // --- 3. MASTER DATA SISWA (BUKU INDUK DENGAN FILTER TAPEL & SEMUE STATUS) ---
        async function bukaMasterDataSiswa() {
            document.getElementById('currentMenuTitle').innerText = "Menu Siswa - Data Buku Induk Madrasah";
            document.getElementById('contentArea').innerHTML = `
                <div class="flex flex-col items-center justify-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-700 mb-3"></div>
                    <p class="text-slate-500 italic text-sm">Sedang memuat database Buku Induk lengkap...</p>
                </div>
            `;
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ action: "ambilDataSiswaAktif" }),
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                if (result.status === "success") {
                    window.allSiswaIndukMasterData = result.data; // Simpan semua tanpa kecuali status (Aktif maupun Mutasi Keluar)
                    renderStrukturBukuInduk();
                }
            } catch(e) { alert("Koneksi bermasalah."); }
        }

        function renderStrukturBukuInduk() {
            window.currentFilterKelas = 'SEMUA';
            const htmlMaster = `
                <div class="space-y-6">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 justify-between items-center">
                        <div class="flex flex-wrap gap-2 items-center">
                            <span class="text-xs font-bold text-slate-500 uppercase mr-1">Filter Jenjang:</span>
                            <button onclick="setFilterKelas('SEMUA')" id="btnFilter-SEMUA" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-700 text-white shadow">All</button>
                            <button onclick="setFilterKelas('10')" id="btnFilter-10" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300">Kelas 10</button>
                            <button onclick="setFilterKelas('11')" id="btnFilter-11" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300">Kelas 11</button>
                            <button onclick="setFilterKelas('12')" id="btnFilter-12" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300">Kelas 12</button>
                        </div>
                        
                        <div class="flex flex-wrap gap-4 items-center w-full md:w-auto justify-between md:justify-end">
                            <div class="flex items-center gap-2">
                                <label class="text-xs font-bold text-slate-600 uppercase">Tahun Pelajaran:</label>
                                <select id="bukuIndukTapel" onchange="jalankanLiveSearchBukuInduk()" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-bold text-slate-700 outline-none">
                                    <option value="2025/2026">2025/2026</option>
                                    <option value="2026/2027" selected>2026/2027</option>
                                    <option value="2027/2028">2027/2028</option>
                                </select>
                            </div>
                            <div style="position: relative !important; width: 100%; max-width: 260px;">
                                <span style="position: absolute !important; left: 12px !important; top: 10px !important; color: #94a3b8 !important;"><i class="fa-solid fa-magnifying-glass"></i></span>
                                <input type="text" id="searchBukuInduk" oninput="jalankanLiveSearchBukuInduk()" placeholder="Ketik nama / nisn..." class="kotak-cari">
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse whitespace-nowrap">
                                <thead>
                                    <tr class="bg-slate-100 text-slate-700 text-xs font-bold uppercase tracking-wider border-b border-slate-200">
                                        <th class="px-4 py-3 text-center w-12">No</th>
                                        <th class="px-4 py-3">Nama Lengkap</th>
                                        <th class="px-4 py-3">NISN / NISM</th>
                                        <th class="px-4 py-3">Tempat, Tgl Lahir</th>
                                        <th class="px-4 py-3">Nama Ayah / Ibu</th>
                                        <th class="px-4 py-3 text-center w-20">Kelas</th>
                                        <th class="px-4 py-3 text-center w-24">Status Siswa</th>
                                    </tr>
                                </thead>
                                <tbody id="bodyTabelSiswa"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('contentArea').innerHTML = htmlMaster;
            window.allSiswaData = window.allSiswaIndukMasterData; 
            jalankanLiveSearchBukuInduk();
        }

        function setFilterKelas(target) {
            window.currentFilterKelas = target;
            ['SEMUA', '10', '11', '12'].forEach(k => {
                const btn = document.getElementById('btnFilter-' + k);
                if (btn) btn.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300";
            });
            document.getElementById('btnFilter-' + target).className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-700 text-white shadow";
            jalankanLiveSearchBukuInduk();
        }

        function jalankanLiveSearchBukuInduk() {
            const keyword = document.getElementById('searchBukuInduk').value.toLowerCase().trim();
            let dataHasil = window.allSiswaIndukMasterData;

            if (window.currentFilterKelas !== 'SEMUA') {
                dataHasil = dataHasil.filter(s => String(s.kelas).startsWith(window.currentFilterKelas));
            }
            if (keyword !== '') {
                dataHasil = dataHasil.filter(s => String(s.nama).toLowerCase().includes(keyword) || String(s.nisn).includes(keyword));
            }

            const tbody = document.getElementById('bodyTabelSiswa');
            if (!tbody) return;

            let rowsHtml = "";
            dataHasil.forEach((siswa, index) => {
                let statusBadge = siswa.status === 'AKTIF' 
                    ? `<span class="bg-emerald-100 text-emerald-800 text-xs font-extrabold px-2.5 py-0.5 rounded-full">AKTIF</span>`
                    : `<span class="bg-rose-100 text-rose-800 text-xs font-extrabold px-2.5 py-0.5 rounded-full">MUTASI</span>`;

                rowsHtml += `
                    <tr class="border-b border-slate-200 hover:bg-slate-50 text-sm">
                        <td class="px-4 py-3 text-center text-slate-500">${index + 1}</td>
                        <td class="px-4 py-3 font-semibold text-slate-800 flex items-center gap-2">
                            <button onclick="bukaPopUpDetailSiswa('${siswa.id}')" class="text-emerald-700 hover:text-amber-500 transition cursor-pointer"><i class="fa-solid fa-circle-user text-base"></i></button>
                            <span>${siswa.nama}</span>
                        </td>
                        <td class="px-4 py-3 text-slate-600 font-mono text-xs">${siswa.nisn} / ${siswa.nism || '-'}</td>
                        <td class="px-4 py-3 text-slate-600 text-xs">${siswa.tempat_lahir}, ${siswa.tanggal_lahir}</td>
                        <td class="px-4 py-3 text-slate-600 text-xs">${siswa.nama_ayah} / ${siswa.nama_ibu}</td>
                        <td class="px-4 py-3 text-center"><span class="bg-blue-50 text-blue-700 text-xs font-bold px-2 py-0.5 rounded">${siswa.kelas}</span></td>
                        <td class="px-4 py-3 text-center">${statusBadge}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = rowsHtml || `<tr><td colspan="7" class="text-center py-12 text-slate-400 italic">Siswa tidak ditemukan...</td></tr>`;
        }

        function bukaPopUpDetailSiswa(idSiswa) {
            const modal = document.getElementById('modalDetailSiswa');
            const konten = document.getElementById('modalKontenDetail');
            const siswa = window.allSiswaIndukMasterData.find(s => String(s.id) === String(idSiswa));
            if (!siswa) return;

            document.getElementById('modalHeaderNama').innerText = "BIODATA BUKU INDUK SISWA: " + siswa.nama;
            konten.innerHTML = `
                <div class="flex justify-between items-center border-b border-slate-200 pb-2 mb-4">
                    <h5 class="text-xs font-bold text-emerald-800 uppercase tracking-wider">Resume Berkas</h5>
                    <button onclick="cetakProfilSiswaAktif('${siswa.id}')" class="bg-rose-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow"><i class="fa-solid fa-print"></i> Cetak Profil</button>
                </div>
                <p><strong>Nama Lengkap:</strong> ${siswa.nama}</p>
                <p><strong>NISN / NISM:</strong> ${siswa.nisn} / ${siswa.nism}</p>
                <p><strong>TTL:</strong> ${siswa.tempat_lahir}, ${siswa.tanggal_lahir}</p>
                <p><strong>Status Terkini:</strong> ${siswa.status}</p>
            `;
            modal.classList.remove('hidden');
        }

        // --- 4. MANAJEMEN MUTASI KELUAR (YANG BISA EDIT INPUT NOMOR SURAT CUSTOM) ---
        async function bukaMenuMutasiKeluar() {
            document.getElementById('currentMenuTitle').innerText = "Menu Siswa - Manajemen Mutasi Keluar Siswa";
            document.getElementById('contentArea').innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 justify-between items-center">
                        <div class="flex items-center gap-3">
                            <label class="text-xs font-bold text-slate-600 uppercase">Tahun Pelajaran:</label>
                            <select id="filterTapelMutasi" onchange="loadDaftarMutasiKeluar()" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs bg-white font-bold text-slate-700 outline-none">
                                <option value="2025/2026">2025/2026</option>
                                <option value="2026/2027" selected>2026/2027</option>
                                <option value="2027/2028">2027/2028</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="switchTabMutasi('ANTREAN')" id="tab-ANTREAN" class="px-4 py-2 text-xs font-bold rounded-lg bg-emerald-700 text-white shadow">Proses Mutasi Keluar</button>
                            <button onclick="switchTabMutasi('RIWAYAT')" id="tab-RIWAYAT" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300">Siswa Sudah Mutasi</button>
                        </div>
                    </div>
                    <div id="workspaceMutasi"></div>
                </div>
            `;
            window.currentTabMutasi = 'ANTREAN';
            loadDaftarMutasiKeluar();
        }

        async function loadDaftarMutasiKeluar() {
            const container = document.getElementById('workspaceMutasi');
            container.innerHTML = `<div class="text-center py-8 italic text-slate-400">Melacak database...</div>`;
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ action: "ambilDataSiswaAktif" }),
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                if (result.status === "success") {
                    window.rawMutasiData = result.data;
                    renderTabAktifMutasi();
                }
            } catch(e) { container.innerHTML = "Gagal memuat data."; }
        }

        function switchTabMutasi(tab) {
            window.currentTabMutasi = tab;
            ['ANTREAN', 'RIWAYAT'].forEach(t => {
                document.getElementById('tab-'+t).className = "px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300";
            });
            document.getElementById('tab-'+tab).className = "px-4 py-2 text-xs font-bold rounded-lg bg-emerald-700 text-white shadow";
            renderTabAktifMutasi();
        }

        function renderTabAktifMutasi() {
            const container = document.getElementById('workspaceMutasi');
            let dataFilter = [];
            
            if (window.currentTabMutasi === 'ANTREAN') {
                dataFilter = window.rawMutasiData.filter(s => s.status === 'AKTIF');
                let tableHtml = `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"><table class="w-full text-left border-collapse text-sm"><thead><tr class="bg-slate-100 text-slate-700 text-xs font-bold uppercase border-b border-slate-200"><th class="px-4 py-3 text-center w-12">No</th><th class="px-4 py-3">Nama Siswa</th><th class="px-4 py-3">NISN / NISM</th><th class="px-4 py-3 text-center">Kelas</th><th class="px-4 py-3 text-center w-32">Aksi Admin</th></tr></thead><tbody>`;
                dataFilter.forEach((siswa, index) => {
                    tableHtml += `
                        <tr class="border-b border-slate-200 hover:bg-slate-50">
                            <td class="px-4 py-3 text-center text-slate-500">${index+1}</td>
                            <td class="px-4 py-3 font-bold text-slate-800">${siswa.nama}</td>
                            <td class="px-4 py-3 text-slate-500 font-mono text-xs">${siswa.nisn} / ${siswa.nism || '-'}</td>
                            <td class="px-4 py-3 text-center">Kelas ${siswa.kelas}</td>
                            <td class="px-4 py-3 text-center">
                                <button onclick="bukaFormEksekusiMutasi(${siswa.rowNumber}, '${siswa.id}', '${siswa.nama.replace(/'/g, "\\'")}')" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow cursor-pointer"><i class="fa-solid fa-paper-plane mr-1"></i> Mutasi Keluar</button>
                            </td>
                        </tr>`;
                });
                container.innerHTML = dataFilter.length ? tableHtml + `</tbody></table></div>` : `<div class="text-center py-12 text-slate-400 italic bg-white rounded-xl border border-dashed border-slate-200">Tidak ada pendaftar aktif.</div>`;
            } else {
                dataFilter = window.rawMutasiData.filter(s => s.status === 'MUTASI KELUAR');
                let tableHtml = `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"><table class="w-full text-left border-collapse text-sm"><thead><tr class="bg-slate-100 text-slate-700 text-xs font-bold uppercase border-b border-slate-200"><th class="px-4 py-3 text-center w-12">No</th><th class="px-4 py-3">Nama Siswa</th><th class="px-4 py-3">Madrasah Sekolah Tujuan</th><th class="px-4 py-3 text-center">Tgl Keluar</th><th class="px-4 py-3 text-center w-32">Cetak Dokumen</th></tr></thead><tbody>`;
                dataFilter.forEach((siswa, index) => {
                    tableHtml += `
                        <tr class="border-b border-slate-200 hover:bg-slate-50">
                            <td class="px-4 py-3 text-center text-slate-500">${index+1}</td>
                            <td class="px-4 py-3 font-bold text-slate-800">${siswa.nama}</td>
                            <td class="px-4 py-3 text-slate-700 font-medium">${siswa.sekolah_tujuan || '-'}</td>

        function bukaFormEksekusiMutasi(rowNumber, idSiswa, namaSiswa) {
            const modal = document.getElementById('modalDetailSiswa');
            const konten = document.getElementById('modalKontenDetail');
            document.getElementById('modalHeaderNama').innerText = "FORM FORMAL MUTASI KELUAR: " + namaSiswa;
            
            konten.innerHTML = `
                <form id="formSubmitMutasi" class="space-y-4">
                    <input type="hidden" id="mutasiRowNumber" value="${rowNumber}">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nama Siswa</label>
                        <input type="text" class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-lg text-sm text-slate-500" value="${namaSiswa}" disabled>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Penyusunan Kode Nomor Surat Resmi:</label>

                            <span class="text-xs text-slate-600 font-mono">/PPWS/YPPWS/MA.WS.bn-E/M/</span>
                            <input type="text" id="noSurat2" placeholder="06" required class="w-10 text-center border-b border-slate-400 outline-none text-xs font-bold text-red-600">
                            <span class="text-xs text-slate-600 font-mono">/</span>
                            <input type="text" id="noSurat3" placeholder="2026" value="2026" required class="w-14 text-center border-b border-slate-400 outline-none text-xs font-bold text-red-600">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tanggal Keluar</label>
                            <input type="date" id="mutasiTanggal" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Sekolah / Madrasah Tujuan</label>
                            <input type="text" id="mutasiSekolahTujuan" placeholder="Ketik nama sekolah tujuan..." required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none">
                        </div>
                    </div>

                    <div class="pt-2 flex justify-end gap-2">
                        <button type="button" onclick="document.getElementById('modalDetailSiswa').classList.add('hidden')" class="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-xs">Batal</button>
                        <button type="submit" id="btnKunciMutasi" class="px-5 py-2 bg-rose-600 text-white font-bold rounded-lg text-xs shadow">Kunci & Simpan</button>
                    </div>
                </form>
            `;
            modal.classList.remove('hidden');
            
            document.getElementById('formSubmitMutasi').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btnKunciMutasi');
                btn.innerText = "Mengunci...";
                btn.disabled = true;
                
                const rNum = document.getElementById('mutasiRowNumber').value;
                const tgl = document.getElementById('mutasiTanggal').value;
                const tujuan = document.getElementById('mutasiSekolahTujuan').value;
                
                // Rakit nomor surat custom gabungan
                const n1 = document.getElementById('noSurat1').value;
                const n2 = document.getElementById('noSurat2').value;
                const n3 = document.getElementById('noSurat3').value;
                const nomorGabunganFull = `${n1}/PPWS/YPPWS/MA.WS.bn-E/M/${n2}/${n3}`;
                
                // Simpan data nomor surat ke memori lokal sementara
                localStorage.setItem(`no_surat_${idSiswa}`, nomorGabunganFull);

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: new URLSearchParams({
                            action: "prosesMutasi",
                            rowNumber: rNum,
                            tglMutasi: tgl,
                            sekolahTujuan: tujuan
                        }),
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    });
                    const result = await response.json();
                    if (result.status === "success") {
                        alert(result.message);
                        modal.classList.add('hidden');
                        bukaMenuMutasiKeluar();
                    }
                } catch(err) { alert("Sistem error."); }
            });
        }
