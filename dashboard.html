<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrasi - MA Wali Songo Lilbanat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .kotak-cari {
            width: 100% !important;
            max-width: 320px !important;
            padding: 8px 12px 8px 36px !important;
            border: 2px solid #cbd5e1 !important;
            background-color: #f8fafc !important;
            border-radius: 8px !important;
            font-size: 14px !important;
            outline: none !important;
            transition: all 0.2s ease-in-out !important;
        }
        .kotak-cari:focus {
            border-color: #059669 !important;
            background-color: #ffffff !important;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2) !important;
        }
    </style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden">

    <aside class="w-64 bg-emerald-900 text-white flex-shrink-0 flex flex-col shadow-xl">
        <div class="p-6 border-b border-emerald-800 text-center">
            <h2 class="text-xl font-bold tracking-widest text-amber-400">MA WALISONGO</h2>
            <p class="text-xs text-emerald-300 uppercase mt-1">Sistem Administrasi</p>
        </div>

        <nav class="flex-1 overflow-y-auto py-4">
            <button onclick="window.location.reload();" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 hover:text-white transition-colors border-l-4 border-amber-500 text-left cursor-pointer font-medium">
                <i class="fa-solid fa-gauge w-6"></i>
                <span class="ml-3">Dashboard</span>
            </button>

            <div id="menuSiswaGroup" class="group">
                <button onclick="toggleMenu('menuSiswa')" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 transition-colors cursor-pointer text-left font-medium">
                    <i class="fa-solid fa-users w-6"></i>
                    <span class="ml-3 flex-1">Menu Siswa</span>
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="menuSiswa" class="hidden bg-emerald-950/50 py-2 text-sm pl-8">
                    <button onclick="bukaDataSiswaPPDB();" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Data Siswa (PPDB/Daful)</button>
                    <button onclick="bukaMenuRombel();" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Rombel Siswa</button>
                    <button class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-not-allowed text-slate-500 bg-transparent border-0 font-medium" disabled>- Mutasi Masuk</button>
                    <button onclick="bukaMenuMutasiKeluar();" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Mutasi Keluar</button>
                    <button onclick="bukaMasterDataSiswa();" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Data Buku Induk</button>
                </div>
            </div>

            <div id="menuGuruGroup" class="group">
                <button onclick="toggleMenu('menuGuru')" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 transition-colors cursor-pointer text-left font-medium">
                    <i class="fa-solid fa-chalkboard-user w-6"></i>
                    <span class="ml-3 flex-1">Guru & Tendik</span>
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="menuGuru" class="hidden bg-emerald-950/50 py-2 text-sm pl-8">
                    <button class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-not-allowed text-slate-500 bg-transparent border-0 font-medium" disabled>- Daftar Guru</button>
                    <button class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-not-allowed text-slate-500 bg-transparent border-0 font-medium" disabled>- Daftar Tendik</button>
                </div>
            </div>

            <div id="menuProgramGroup" class="group">
                <button onclick="toggleMenu('menuProgram')" class="w-full flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-800 transition-colors cursor-pointer text-left font-medium">
                    <i class="fa-solid fa-clipboard-list w-6"></i>
                    <span class="ml-3 flex-1">Program</span>
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="menuProgram" class="hidden bg-emerald-950/50 py-2 text-sm pl-8">
                    <button onclick="bukaFormLaporan('Tendik')" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Program Tendik</button>
                    <button onclick="bukaFormLaporan('Kesiswaan')" class="w-full text-left block py-2 px-4 hover:text-amber-400 cursor-pointer text-emerald-100 bg-transparent border-0 font-medium">- Program Kesiswaan</button>
                </div>
            </div>

            <button onclick="logout()" class="w-full flex items-center px-6 py-3 mt-8 text-rose-300 hover:bg-rose-950 transition-colors text-left font-bold cursor-pointer">
                <i class="fa-solid fa-right-from-bracket w-6"></i>
                <span class="ml-3">Keluar Sistem</span>
            </button>
        </nav>

        <div class="p-4 bg-emerald-950 text-center text-[10px] text-emerald-500 uppercase tracking-tighter">
            &copy; 2026 MA Wali Songo Lilbanat
        </div>
    </aside>

    <main class="flex-1 flex flex-col">
        <header class="bg-white h-16 shadow-sm flex items-center justify-between px-8">
            <h3 class="text-slate-600 font-semibold" id="currentMenuTitle">Halaman Utama</h3>
            <div class="flex items-center space-x-4">
                <span id="userNama" class="text-sm text-slate-500 font-medium">Halo, Pengguna</span>
                <div id="userInisial" class="h-8 w-8 bg-amber-500 rounded-full flex items-center justify-center text-white font-bold">?</div>
            </div>
        </header>

        <div class="p-8 overflow-y-auto" id="contentArea">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-xs font-bold text-slate-500 uppercase">Total Siswa Aktif</p>
                    <h4 class="text-2xl font-black text-slate-800">120</h4>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-emerald-500">
                    <p class="text-xs font-bold text-slate-500 uppercase">Siswa Baru (PPDB)</p>
                    <h4 class="text-2xl font-black text-slate-800">45</h4>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-amber-500">
                    <p class="text-xs font-bold text-slate-500 uppercase">Guru & Tendik</p>
                    <h4 class="text-2xl font-black text-slate-800">18</h4>
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow-sm h-64 flex items-center justify-center border-2 border-dashed border-slate-200">
                <p class="text-slate-400 italic">Pilih menu di samping untuk mengelola administrasi...</p>
            </div>
        </div>
    </main>

    <div id="modalDetailSiswa" onclick="tutupModalDetail(event)" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200" onclick="event.stopPropagation()">
            <div class="bg-emerald-800 text-white p-4 flex justify-between items-center flex-shrink-0">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-address-card text-amber-400 text-lg"></i>
                    <h3 class="font-bold text-base tracking-wide" id="modalHeaderNama">Detail</h3>
                </div>
                <button onclick="document.getElementById('modalDetailSiswa').classList.add('hidden')" class="text-white/80 hover:text-white hover:bg-emerald-900 h-8 w-8 rounded-full transition flex items-center justify-center cursor-pointer font-black">✕</button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6 text-sm text-slate-700" id="modalKontenDetail"></div>
            <div class="bg-slate-50 p-3 border-t border-slate-100 flex justify-end flex-shrink-0">
                <button onclick="document.getElementById('modalDetailSiswa').classList.add('hidden')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-lg text-xs transition cursor-pointer">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwNf6X1QPHHfFRc1mZoG1Tmzss39N026ldLGJDMLYg-Fxfi2moq2-xIuK7GpWmvp9tv/exec";

        // --- 1. PROTEKSI LOGIN ---
        const userData = JSON.parse(localStorage.getItem('user_sim'));
        if (!userData) { window.location.href = "login.html"; } 
        else {
            document.getElementById('currentMenuTitle').innerText = "Dashboard - " + userData.jabatan;
            document.getElementById('userNama').innerText = "Halo, " + userData.nama;
            document.getElementById('userInisial').innerText = userData.nama.charAt(0).toUpperCase();
            if (userData.role === "TENDIK") {
                document.getElementById('menuSiswaGroup').style.display = 'none';
                document.getElementById('menuGuruGroup').style.display = 'none';
            }
        }

        function toggleMenu(id) { document.getElementById(id).classList.toggle('hidden'); }
        function logout() { localStorage.removeItem('user_sim'); window.location.href = "login.html"; }

        // --- 2. FORM PELAPORAN BULANAN TENDIK ---
        function bukaFormLaporan(jenisProgram) {
            document.getElementById('currentMenuTitle').innerText = "Program " + jenisProgram + " - Laporan Bulanan";
            const htmlForm = `
                <div class="bg-white p-6 rounded-xl shadow-sm max-w-2xl border-t-4 border-emerald-600">
                    <h4 class="text-lg font-bold text-slate-700 mb-4">Form Pelaporan Bulanan (${jenisProgram.toUpperCase()})</h4>
                    <form id="formLaporanBulanan" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Bulan Pelaporan</label>
                            <select id="bulanLaporan" required class="w-full px-4 py-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                                <option value="">-- Pilih Bulan --</option>
                                <option value="Januari">Januari</option>
                                <option value="Februari">Februari</option>
                                <option value="Maret">Maret</option>
                                <option value="April">April</option>
                                <option value="Mei">Mei</option>
                                <option value="Juni">Juni</option>
                                <option value="Juli">Juli</option>
                                <option value="Agustus">Agustus</option>
                                <option value="September">September</option>
                                <option value="Oktober">Oktober</option>
                                <option value="November">November</option>
                                <option value="Desember">Desember</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Rincian Laporan Kegiatan</label>
                            <textarea id="isiLaporan" rows="6" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Ketikkan laporan bulanan secara detail di sini..."></textarea>
                        </div>
                        <button type="submit" id="btnKirimLaporan" class="bg-emerald-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-emerald-700 transition shadow cursor-pointer">Kirim Laporan</button>
                    </form>
                </div>
            `;
            document.getElementById('contentArea').innerHTML = htmlForm;

            document.getElementById('formLaporanBulanan').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btnKirimLaporan');
                if (btn.disabled) return;
                btn.innerText = "Mengirim..."; btn.disabled = true;
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: new URLSearchParams({
                            action: "simpanLaporan",
                            username: userData.username || "user_sim",
                            nama: userData.nama,
                            jabatan: userData.jabatan,
                            bulan: document.getElementById('bulanLaporan').value + " (" + jenisProgram + ")",
                            isi_laporan: document.getElementById('isiLaporan').value
                        }),
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    });
                    const res = await response.json();
                    if (res.status === "success") { alert("Laporan Berhasil Tersimpan!"); bukaFormLaporan(jenisProgram); }
                } catch (err) { alert("Error koneksi."); } finally { btn.innerText = "Kirim Laporan"; btn.disabled = false; }
            });
        }

        // --- 3. DATA BUKU INDUK LENGKAP ---
        async function bukaMasterDataSiswa() {
            document.getElementById('currentMenuTitle').innerText = "Menu Siswa - Data Buku Induk Madrasah";
            document.getElementById('contentArea').innerHTML = `
                <div class="flex flex-col items-center justify-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-700 mb-3"></div>
                    <p class="text-slate-500 italic text-sm">Sedang memuat database Buku Induk lengkap...</p>
                </div>
            `;
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ action: "ambilDataSiswaAktif" }),
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                if (result.status === "success") {
                    window.allSiswaData = result.data;
                    window.allSiswaIndukMasterData = result.data;
                    
                    window.currentFilterKelas = 'SEMUA';
                    const htmlMaster = `
                        <div class="space-y-6">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 justify-between items-center" style="display: flex !important;">
                                <div class="flex flex-wrap gap-2 w-full md:w-auto">
                                    <button onclick="setFilterKelas('SEMUA')" id="btnFilter-SEMUA" class="px-4 py-2 text-xs font-bold rounded-lg bg-emerald-700 text-white shadow transition cursor-pointer">All</button>
                                    <button onclick="setFilterKelas('10')" id="btnFilter-10" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition cursor-pointer">Kelas 10</button>
                                    <button onclick="setFilterKelas('11')" id="btnFilter-11" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition cursor-pointer">Kelas 11</button>
                                    <button onclick="setFilterKelas('12')" id="btnFilter-12" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition cursor-pointer">Kelas 12</button>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="flex items-center gap-2">
                                        <label class="text-xs font-bold text-slate-600 uppercase">Tahun Pelajaran:</label>
                                        <select id="bukuIndukTapel" onchange="jalankanLiveSearchBukuInduk()" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-bold text-slate-700 outline-none bg-white">
                                            <option value="2025/2026">2025/2026</option>
                                            <option value="2026/2027" selected>2026/2027</option>
                                            <option value="2027/2028">2027/2028</option>
                                        </select>
                                    </div>
                                    <div style="position: relative !important; width: 100% !important; max-width: 260px !important;">
                                        <span style="position: absolute !important; left: 12px !important; top: 10px !important; color: #94a3b8 !important;"><i class="fa-solid fa-magnifying-glass"></i></span>
                                        <input type="text" id="searchBukuInduk" oninput="jalankanLiveSearchBukuInduk()" placeholder="Ketik nama / nisn..." class="kotak-cari">
                                    </div>
                                </div>
                            </div>
                            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse whitespace-nowrap">
                                        <thead>
                                            <tr class="bg-slate-100 text-slate-700 text-xs font-bold uppercase tracking-wider border-b border-slate-200">
                                                <th class="px-4 py-3 text-center w-12">No</th>
                                                <th class="px-4 py-3">Nama Lengkap</th>
                                                <th class="px-4 py-3">NISN / NISM</th>
                                                <th class="px-4 py-3">TTL</th>
                                                <th class="px-4 py-3">Orang Tua</th>
                                                <th class="px-4 py-3 text-center w-20">Kelas</th>
                                                <th class="px-4 py-3 text-center w-24">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody id="bodyTabelSiswa"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                    document.getElementById('contentArea').innerHTML = htmlMaster;
                    jalankanLiveSearchBukuInduk();
                }
            } catch(e) { alert("Koneksi bermasalah."); }
        }

        function setFilterKelas(target) {
            window.currentFilterKelas = target;
            ['SEMUA', '10', '11', '12'].forEach(k => {
                const btn = document.getElementById('btnFilter-' + k);
                if (btn) btn.className = "px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition cursor-pointer";
            });
            document.getElementById('btnFilter-' + target).className = "px-4 py-2 text-xs font-bold rounded-lg bg-emerald-700 text-white shadow transition cursor-pointer";
            jalankanLiveSearchBukuInduk();
        }

        function jalankanLiveSearchBukuInduk() {
            const keyword = document.getElementById('searchBukuInduk').value.toLowerCase().trim();
            let dataHasil = window.allSiswaIndukMasterData;
            if (window.currentFilterKelas !== 'SEMUA') dataHasil = dataHasil.filter(s => String(s.kelas).startsWith(window.currentFilterKelas));
            if (keyword !== '') dataHasil = dataHasil.filter(s => String(s.nama).toLowerCase().includes(keyword) || String(s.nisn).includes(keyword));
            
            const tbody = document.getElementById('bodyTabelSiswa');
            if (!tbody) return;
            let rowsHtml = "";
            dataHasil.forEach((siswa, index) => {
                let badge = siswa.status === 'AKTIF' 
                    ? `<span class="bg-emerald-100 text-emerald-800 text-xs font-extrabold px-2.5 py-0.5 rounded-full">AKTIF</span>`
                    : `<span class="bg-rose-100 text-rose-800 text-xs font-extrabold px-2.5 py-0.5 rounded-full">MUTASI KELUAR</span>`;
                rowsHtml += `
                    <tr class="border-b border-slate-200 hover:bg-slate-50 text-sm">
                        <td class="px-4 py-3 text-center text-slate-500">${index + 1}</td>
                        <td class="px-4 py-3 font-semibold text-slate-800 flex items-center gap-2">
                            <button onclick="bukaPopUpDetailSiswa('${siswa.id}')" class="text-emerald-700 hover:text-amber-500 transition cursor-pointer"><i class="fa-solid fa-circle-user text-base"></i></button>
                            <span>${siswa.nama}</span>
                        </td>
                        <td class="px-4 py-3 text-slate-600 font-mono text-xs">${siswa.nisn} / ${siswa.nism || '-'}</td>
                        <td class="px-4 py-3 text-slate-600 text-xs">${siswa.tempat_lahir}, ${siswa.tanggal_lahir}</td>
                        <td class="px-4 py-3 text-slate-600 text-xs">${siswa.nama_ayah} / ${siswa.nama_ibu}</td>
                        <td class="px-4 py-3 text-center"><span class="bg-blue-50 text-blue-700 text-xs font-bold px-2 py-0.5 rounded">${siswa.kelas}</span></td>
                        <td class="px-4 py-3 text-center">${badge}</td>
                    </tr>`;
            });
            tbody.innerHTML = rowsHtml || `<tr><td colspan="7" class="text-center py-12 text-slate-400 italic">Data siswa tidak ditemukan...</td></tr>`;
        }

        // --- 4. FUNGSI POP-UP DETAIL SISWA INDUK ---
        function bukaPopUpDetailSiswa(idSiswa) {
            const modal = document.getElementById('modalDetailSiswa');
            const konten = document.getElementById('modalKontenDetail');
            const siswa = window.allSiswaIndukMasterData.find(s => String(s.id) === String(idSiswa));
            if (!siswa) { alert("Data siswa tidak ditemukan."); return; }

            document.getElementById('modalHeaderNama').innerText = "BIODATA BUKU INDUK SISWA: " + siswa.nama;
            konten.innerHTML = `
                <div class="border-b border-slate-200 pb-3 mb-4 flex justify-between items-center">
                    <h5 class="text-xs font-bold text-emerald-800 uppercase tracking-wider"><i class="fa-solid fa-user-graduate mr-1"></i> Identitas Pribadi Siswa</h5>
                    <button onclick="cetakProfilSiswaAktif('${siswa.id}')" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-print"></i> Cetak Profil</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                    <div class="bg-slate-50 p-2 border rounded-lg"><p class="text-[10px] font-bold text-slate-400 uppercase">ID Sistem / Kelas</p><p class="font-bold text-slate-800 mt-0.5">${siswa.id} / ${siswa.kelas}</p></div>
                    <div class="bg-slate-50 p-2 border rounded-lg"><p class="text-[10px] font-bold text-slate-400 uppercase">Nomor NISN</p><p class="font-mono font-bold text-slate-700 mt-0.5">${siswa.nisn}</p></div>
                    <div class="bg-slate-50 p-2 border rounded-lg"><p class="text-[10px] font-bold text-slate-400 uppercase">Nomor NISM</p><p class="font-mono font-bold text-slate-700 mt-0.5">${siswa.nism || '-'}</p></div>
                    <div class="bg-slate-50 p-2 border rounded-lg"><p class="text-[10px] font-bold text-slate-400 uppercase">NIK Siswa</p><p class="font-mono text-slate-700 mt-0.5">${siswa.nik || "-"}</p></div>
                    <div class="bg-slate-50 p-2 border rounded-lg"><p class="text-[10px] font-bold text-slate-400 uppercase">TTL</p><p class="font-medium text-slate-700 mt-0.5">${siswa.tempat_lahir}, ${siswa.tanggal_lahir}</p></div>
                    <div class="bg-slate-50 p-2 border rounded-lg"><p class="text-[10px] font-bold text-slate-400 uppercase">Jenis Kelamin</p><p class="font-medium text-slate-700 mt-0.5">${siswa.jk}</p></div>
                </div>
                <div class="border-b border-slate-200 pb-3 pt-2 mb-4"><h5 class="text-xs font-bold text-emerald-800 uppercase tracking-wider"><i class="fa-solid fa-users mr-1"></i> Data Orang Tua & Hubungan Keluarga</h5></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div class="bg-slate-50 p-2 border rounded-lg"><p class="text-[10px] font-bold text-slate-400 uppercase">Nama Ayah / NIK Ayah</p><p class="font-bold text-slate-800 mt-0.5">${siswa.nama_ayah} / <span class="font-mono text-slate-500">${siswa.nik_ayah || "-"}</span></p></div>

        function renderTabelPPDB(arrayData) {
            const tbody = document.getElementById('bodyTabelPPDB');
            if (!tbody) return;
            let rowsHtml = "";
            arrayData.forEach((siswa, index) => {
                let badgeClass = siswa.status_daful === "SUDAH DAFTAR ULANG" ? "bg-emerald-100 text-emerald-800 border-emerald-200 font-extrabold" : "bg-amber-100 text-amber-800 border-amber-200";
                let tombolDaful = siswa.status_daful === "SUDAH DAFTAR ULANG" 
                    ? `<button class="bg-slate-100 text-slate-400 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 cursor-not-allowed" disabled><i class="fa-solid fa-check"></i> Selesai</button>`
                    : `<button id="btnDaful-${siswa.rowNumber}" onclick="eksekusiDaftarUlang(${siswa.rowNumber}, '${siswa.nama.replace(/'/g, "\\'")}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition cursor-pointer flex items-center gap-1"><i class="fa-solid fa-user-check"></i> Daful</button>`;

                        <td class="px-4 py-3 font-semibold text-slate-800">${siswa.nama}</td>

            const btn = document.getElementById(`btnDaful-${rowNumber}`);
            if(btn) { btn.innerText = "Locking..."; btn.disabled = true; }
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ action: "prosesDaful", rowNumber: rowNumber }),
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                if (result.status === "success") { alert(result.message); bukaDataSiswaPPDB(); }
            } catch (err) { alert("Error internet."); }

        async function loadDetailSiswaRombel(namaRombel, tingkat) {
            try {
                const response = await fetch(API_URL, { method: 'POST', body: new URLSearchParams({ action: "ambilDataSiswaAktif" }), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                const result = await response.json();
                if (result.status === "success") {
                    let htmlAnggota = ""; let counter = 0;
                    result.data.forEach(siswa => {
                        if (String(siswa.kelas).trim() === String(namaRombel).trim() && siswa.status === 'AKTIF') {
                            counter++;
                            htmlAnggota += `
                                <tr class="border-b border-slate-200 hover:bg-slate-50">
                                    <td class="px-4 py-2 text-center text-slate-500 text-xs">${counter}</td>

                                    <td class="px-4 py-2 text-center"><button id="btnKeluar-${siswa.rowNumber}" onclick="pindahkanSiswaKeRombel(${siswa.rowNumber}, '${tingkat}', '${namaRombel}', '${siswa.nama.replace(/'/g, "\\'")}', true)" class="text-rose-600 border border-rose-300 hover:bg-rose-600 hover:text-white text-[10px] font-bold px-2 py-1 rounded transition">Keluarkan</button></td>

                    });
                    document.getElementById('countAnggota').innerText = `${counter} Anak`;
                    document.getElementById('bodyAnggotaRombel').innerHTML = htmlAnggota || `<tr><td colspan="4" class="text-center py-6 text-slate-400">Kosong...</td></tr>`;

                    const resKosong = await fetch(API_URL, { method: 'POST', body: new URLSearchParams({ action: "ambilSiswaTanpaRombel", tingkat: tingkat }), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    const resultKosong = await resKosong.json();
                    if (resultKosong.status === "success") { window.allSiswaTanpaRombel = resultKosong.data; jalankanSearchAntreanRombel(namaRombel, tingkat); }
                }
            } catch (err) {}
        }

        function jalankanSearchAntreanRombel(namaRombel, tingkat) {
            const box = document.getElementById('boxSiswaKosong');
            const keyword = document.getElementById('searchAntreanRombel').value.toLowerCase().trim();
            if (!box || !window.allSiswaTanpaRombel) return;
            let filtered = window.allSiswaTanpaRombel;
            if (keyword !== '') filtered = filtered.filter(s => String(s.nama).toLowerCase().includes(keyword));
            let html = "";
            filtered.forEach(siswa => {
                html += `
                    <div class="p-2 bg-slate-50 border rounded-lg flex items-center justify-between text-xs">
                        <div><p class="font-bold text-slate-800">${siswa.nama}</p></div>

            });
            box.innerHTML = html || `<p class="p-4 text-center text-slate-400 italic">Habis...</p>`;
        }

            try {
                const response = await fetch(API_URL, { method: 'POST', body: new URLSearchParams({ action: "updateRombel", rowNumber: rowNumber, kelasBaru: kelasTujuan }), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });

        }

                            <td class="px-4 py-3 text-center">Kelas ${siswa.kelas}</td>
                            <td class="px-4 py-3 text-center"><button onclick="bukaFormEksekusiMutasi(${siswa.rowNumber}, '${siswa.id}', '${siswa.nama.replace(/'/g, "\\'")}')" class="bg-rose-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow"><i class="fa-solid fa-paper-plane mr-1"></i> Mutasi Keluar</button></td>
                        </tr>`;
                });
                container.innerHTML = filtered.length ? tableHtml + `</tbody></table></div>` : `<div class="text-center py-12 text-slate-400 italic bg-white rounded-xl border border-dashed border-slate-200">Kosong...</div>`;
            } else {
                filtered = window.rawMutasiData.filter(s => s.status === 'MUTASI KELUAR');
                let tableHtml = `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"><table class="w-full text-left border-collapse text-sm"><thead><tr class="bg-slate-100 text-slate-700 text-xs font-bold uppercase border-b border-slate-200"><th class="px-4 py-3 text-center w-12">No</th><th class="px-4 py-3">Nama Siswa</th><th class="px-4 py-3">Sekolah Tujuan</th><th class="px-4 py-3 text-center">Tgl Keluar</th><th class="px-4 py-3 text-center w-32">Cetak</th></tr></thead><tbody>`;
                filtered.forEach((siswa, index) => {
                    tableHtml += `
                        <tr class="border-b border-slate-200 hover:bg-slate-50">
                            <td class="px-4 py-3 text-center text-slate-500">${index+1}</td>
                            <td class="px-4 py-3 font-bold text-slate-800">${siswa.nama}</td>
                            <td class="px-4 py-3 text-slate-700">${siswa.sekolah_tujuan || '-'}</td>
                            <td class="px-4 py-3 text-center text-slate-600 text-xs">${siswa.tgl_mutasi || '-'}</td>
                            <td class="px-4 py-3 text-center"><button onclick="cetakSuratKeteranganMutasi('${siswa.id}')" class="bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow"><i class="fa-solid fa-print"></i> Cetak Surat</button></td>
                        </tr>`;
                });
                container.innerHTML = filtered.length ? tableHtml + `</tbody></table></div>` : `<div class="text-center py-12 text-slate-400 italic bg-white rounded-xl border border-dashed border-slate-200">Kosong...</div>`;
            }
        }

        function bukaFormEksekusiMutasi(rowNumber, idSiswa, namaSiswa) {
            const modal = document.getElementById('modalDetailSiswa');
            const konten = document.getElementById('modalKontenDetail');
            document.getElementById('modalHeaderNama').innerText = "FORM MUTASI KELUAR: " + namaSiswa;
            konten.innerHTML = `
                <form id="formSubmitMutasi" class="space-y-4">
                    <input type="hidden" id="mutasiRowNumber" value="${rowNumber}">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Kode Nomor Surat Resmi:</label>
                        <div class="flex flex-wrap items-center gap-1 bg-slate-50 p-2 border border-slate-300 rounded-lg">
                            <span class="text-xs text-slate-500 font-bold">Nomor :</span>
                            <input type="text" id="noSurat1" placeholder="001" required class="w-12 text-center border-b outline-none text-xs font-bold text-red-600 border-slate-400">
                            <span class="text-xs text-slate-600 font-mono">/PPWS/YPPWS/MA.WS.bn-E/M/</span>
                            <input type="text" id="noSurat2" placeholder="06" required class="w-10 text-center border-b outline-none text-xs font-bold text-red-600 border-slate-400">
                            <span class="text-xs text-slate-600 font-mono">/</span>
                            <input type="text" id="noSurat3" value="2026" required class="w-14 text-center border-b outline-none text-xs font-bold text-red-600 border-slate-400">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tanggal Keluar</label>
                            <input type="date" id="mutasiTanggal" required class="w-full px-3 py-2 border rounded-lg text-sm border-slate-300 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Sekolah Tujuan</label>
                            <input type="text" id="mutasiSekolahTujuan" placeholder="Ketik nama sekolah..." required class="w-full px-3 py-2 border rounded-lg text-sm border-slate-300 outline-none">
                        </div>
                    </div>
                    <div class="pt-2 flex justify-end gap-2">
                        <button type="button" onclick="document.getElementById('modalDetailSiswa').classList.add('hidden')" class="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-xs">Batal</button>
                        <button type="submit" id="btnKunciMutasi" class="px-5 py-2 bg-rose-600 text-white font-bold rounded-lg text-xs shadow">Simpan</button>
                    </div>
                </form>`;
            modal.classList.remove('hidden');

            document.getElementById('formSubmitMutasi').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btnKunciMutasi');
                btn.innerText = "Mengunci..."; btn.disabled = true;
                const nomorFull = `${document.getElementById('noSurat1').value}/PPWS/YPPWS/MA.WS.bn-E/M/${document.getElementById('noSurat2').value}/${document.getElementById('noSurat3').value}`;
                localStorage.setItem(`no_surat_${idSiswa}`, nomorFull);

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: new URLSearchParams({
                            action: "prosesMutasi",
                            rowNumber: document.getElementById('mutasiRowNumber').value,
                            tglMutasi: document.getElementById('mutasiTanggal').value,
                            sekolahTujuan: document.getElementById('mutasiSekolahTujuan').value
                        }),
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    });
                    const res = await response.json();
                    if (res.status === "success") { alert(res.message); modal.classList.add('hidden'); bukaMenuMutasiKeluar(); }
                } catch(err) { alert("Error."); }
            });
        }

        // --- 8. PRINT PROFIL SISWA ---
        function cetakProfilSiswaAktif(idSiswa) {
            const siswa = window.allSiswaIndukMasterData.find(s => String(s.id) === String(idSiswa));
            if (!siswa) return;

            const tanggalInputManual = prompt("Masukkan tanggal penandatanganan buku induk:\n(Contoh: 12 Juni 2026)", "");
            if (tanggalInputManual === null) return; 
            const tglFix = tanggalInputManual.trim() !== "" ? tanggalInputManual : new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });

            const alamat = `Dsn. ${siswa.dusun || '-'}, RT/RW: ${siswa.rtrw || '-'}, Desa ${siswa.desa || '-'}, Kec. ${siswa.kecamatan || '-'}, Kab. ${siswa.kabupaten || '-'}, Prov. ${siswa.provinsi || '-'} - ${siswa.kode_pos || '-'}`;
            
            const pW = window.open('', '_blank');
            pW.document.write(`<html><head><title>Cetak Profil - ${siswa.nama}</title><style>@page { size: A4; margin: 20mm; } body { font-family: Arial; font-size: 13px; color: #000; } .judul { text-align: center; font-weight: bold; font-size: 15px; margin-bottom: 25px; border-bottom: 2px solid #000; padding-bottom: 5px; } table { width: 100%; margin-bottom: 10px; } td { padding: 4px; vertical-align: top; } .nomor { width: 4%; } .label-kolom { width: 32%; } .titik-dua { width: 2%; text-align: center; }</style></head><body><div class="judul">DATA DIRI PESERTA DIDIK MA WALI SONGO LILBANAT</div><strong>I. SISWA</strong><table><tr><td class="nomor">1.</td><td class="label-kolom">Nama Lengkap</td><td class="titik-dua">:</td><td><strong>${siswa.nama.toUpperCase()}</strong></td></tr><tr><td class="nomor">2.</td><td class="label-kolom">NISM</td><td class="titik-dua">:</td><td>${siswa.nism || '-'}</td></tr><tr><td class="nomor">3.</td><td class="label-kolom">NISN</td><td class="titik-dua">:</td><td>${siswa.nisn}</td></tr><tr><td class="nomor">4.</td><td class="label-kolom">Jenis Kelamin</td><td class="titik-dua">:</td><td>${siswa.jk}</td></tr><tr><td class="nomor">5.</td><td class="label-kolom">Tempat, Tanggal Lahir</td><td class="titik-dua">:</td><td>${siswa.tempat_lahir}, ${siswa.tanggal_lahir}</td></tr><tr><td class="nomor">6.</td><td class="label-kolom">Agama</td><td class="titik-dua">:</td><td>${siswa.agama || 'Islam'}</td></tr><tr><td class="nomor">7.</td><td class="label-kolom">Anak Ke</td><td class="titik-dua">:</td><td>${siswa.anak_ke || '-'}</td></tr><tr><td class="nomor">8.</td><td class="label-kolom">Status Anak</td><td class="titik-dua">:</td><td>${siswa.status_anak || 'Anak Kandung'}</td></tr><tr><td class="nomor">9.</td><td class="label-kolom">Alamat Siswa</td><td class="titik-dua">:</td><td>${alamat}</td></tr></table><br><strong>II. ORANG TUA</strong><table><tr><td class="nomor">1.</td><td class="label-kolom">Nama Ayah / Ibu</td><td class="titik-dua">:</td><td>${siswa.nama_ayah} / ${siswa.nama_ibu}</td></tr><tr><td class="nomor">2.</td><td class="label-kolom">Alamat Orang Tua</td><td class="titik-dua">:</td><td>${alamat}</td></tr><tr><td class="nomor">3.</td><td class="label-kolom">Pekerjaan Ayah / Ibu</td><td class="titik-dua">:</td><td>${siswa.pekerjaan_ayah || '-'} / ${siswa.pekerjaan_ibu || '-'}</td></tr><tr><td class="nomor">4.</td><td class="label-kolom">Masuk Di Kelas / Tanggal</td><td class="titik-dua">:</td><td>Kelas ${siswa.kelas} / ${tglFix}</td></tr><tr><td class="nomor">5.</td><td class="label-kolom">Sekolah Asal</td><td class="titik-dua">:</td><td>${siswa.sekolah_asal || '-'}</td></tr></table><div style="margin-top:40px;width:100%;display:flex;justify-content:space-between;"><div style="width:3cm;height:4cm;border:1px dashed #000;display:flex;align-items:center;justify-content:center;font-size:10px;">FOTO 3X4</div><div style="text-align:center;">Situbondo, ${tglFix}<br>Kepala Madrasah,<br><br><br><br><br><strong><u>Andi Hariyanto, Gr.</u></strong></div></div></body></html>`);
            pW.document.close();
            pW.print();
        }

        // --- 9. PRINT SURAT MUTASI KELUAR (MENAMPILKAN FILE KOP ORIGINAL DARI FOLDER ASSETS & WATERMARK TENGAH KERTAS) ---

                    .kop-wrapper { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                    .watermark { opacity: 0.06 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                }
            </style></head><body>
                
                <img class="watermark" src="https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_Kementerian_Agama.png" alt="Watermark">

                <div class="kop-wrapper"> 
                    <img class="kop-gambar-asli" src="assets/KOP SURAT  LUAR NEW.png" alt="Kop Surat MA Wali Songo Lilbanat">
                </div>

                <div style="text-align:center;font-weight:bold;font-size:15px;text-decoration:underline;">SURAT KETERANGAN PINDAH MADRASAH</div>
                <div style="text-align:center;font-weight:bold;margin-bottom:30px;">Nomor: ${nomorSuratFinal}</div>
                <p>Yang bertanda tangan di bawah ini, Kepala Madrasah Aliyah Wali Songo Lilbanat Situbondo, menerangkan dengan sebenarnya bahwa:</p>
                <table>
                    <tr><td class="l">1. Nama Lengkap</td><td class="t">:</td><td><strong>${siswa.nama.toUpperCase()}</strong></td></tr>
                    <tr><td class="l">2. NISN / NISM</td><td class="t">:</td><td>${siswa.nisn} / ${siswa.nism || '-'}</td></tr>
                    <tr><td class="l">3. Jenis Kelamin</td><td class="t">:</td><td>${siswa.jk}</td></tr>
                    <tr><td class="l">4. Tempat, Tanggal Lahir</td><td class="t">:</td><td>${siswa.tempat_lahir}, ${siswa.tanggal_lahir}</td></tr>
                    <tr><td class="l">5. Agama</td><td class="t">:</td><td>${siswa.agama || 'Islam'}</td></tr>
                    <tr><td class="l">6. Di Kelas Pindah</td><td class="t">:</td><td>Kelas ${siswa.kelas}</td></tr>
                    <tr><td class="l">7. Orang Tua Kandung</td><td class="t">:</td><td>Ayah: ${siswa.nama_ayah} <br> Ibu: ${siswa.nama_ibu}</td></tr>
                </table>
                <p>Telah mengajukan permohonan mutasi pindah keluar dari Madrasah Aliyah Wali Songo Lilbanat Situbondo menuju ke:</p>
                <table>
                    <tr><td class="l">Sekolah Tujuan</td><td class="t">:</td><td><strong>${siswa.sekolah_tujuan.toUpperCase()}</strong></td></tr>
                    <tr><td class="l">Tahun Pelajaran</td><td class="t">:</td><td>${tapel}</td></tr>
                    <tr><td class="l">Tanggal Efektif Keluar</td><td class="t">:</td><td>${siswa.tgl_mutasi || '-'}</td></tr>
                </table>
                <p>Demikian surat keterangan ini dibuat untuk dipergunakan sebagaimana mestinya.</p>
                <div style="margin-top:50px;width:100%;display:flex;justify-content:flex-end;">
                    <div style="text-align:center;width:50%;">Situbondo, ${tglFormatted}<br>Kepala Madrasah,<br><br><br><br><br><strong><u>Andi Hariyanto, Gr.</u></strong></div>

        function tutupModalDetail(e) { document.getElementById('modalDetailSiswa').classList.add('hidden'); }
    </script>
</body>
